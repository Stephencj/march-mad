<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Editor — March Madness 3v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: sans-serif; color: white; }
    #container { display: flex; width: 100%; height: 100%; }
    #canvas-wrap { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #panel {
      width: 360px;
      background: rgba(15, 18, 32, 0.96);
      border-left: 2px solid #e94560;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <a href="index.html" style="position:fixed;top:12px;left:12px;z-index:100;padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-family:sans-serif;font-size:13px;">&larr; Back to Game</a>
  <div id="container">
    <div id="canvas-wrap">
      <canvas id="editor-canvas"></canvas>
    </div>
    <div id="panel"></div>
  </div>
  <script type="module" src="/src/player-editor.ts"></script>
</body>
</html>
