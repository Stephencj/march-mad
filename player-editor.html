<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Editor — March Madness 3v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: sans-serif; color: white; }
    #container { display: flex; width: 100%; height: 100%; }
    #canvas-wrap { flex: 1; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #panel {
      width: 360px;
      background: rgba(15, 18, 32, 0.96);
      border-left: 2px solid #e94560;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div style="position:fixed;top:12px;left:12px;z-index:100;display:flex;gap:6px;font-family:sans-serif;">
    <a href="index.html" style="padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-size:13px;">&larr; Back to Game</a>
    <a href="anim-viewer.html" style="padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-size:13px;">Animation Viewer &rarr;</a>
    <a href="mocap-editor.html" style="padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-size:13px;">Mocap Editor &rarr;</a>
    <a href="face-editor.html" style="padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-size:13px;">Face Editor &rarr;</a>
    <a href="face-mirror.html" style="padding:6px 10px;background:#1f2540;color:#e94560;border:1px solid #e94560;border-radius:4px;text-decoration:none;font-size:13px;">Face Mirror &rarr;</a>
  </div>
  <div id="container">
    <div id="canvas-wrap" style="position:relative;">
      <canvas id="editor-canvas"></canvas>
      <!-- Phase 8.2a: source-video overlay for face-anim playback. Hidden
           until the user toggles "Show source video" AND the active clip
           carries a videoBlob. -->
      <video id="face-anim-source-video"
             playsinline muted loop
             style="position:absolute;bottom:12px;left:12px;width:200px;height:200px;
                    border:2px solid #e94560;border-radius:6px;background:#000;
                    transform:scaleX(-1);object-fit:cover;display:none;
                    pointer-events:none;"></video>
    </div>
    <div id="panel"></div>
  </div>
  <script type="module" src="/src/player-editor.ts"></script>
</body>
</html>
