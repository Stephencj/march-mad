<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mocap Editor — March Madness 3v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: sans-serif; color: white; }
    #container { display: flex; width: 100%; height: 100%; }
    #canvas-wrap { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    /* The webcam feed and the skeleton-overlay canvas share the same box. */
    #stage { position: relative; width: 100%; height: 100%; }
    #webcam, #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    #overlay { pointer-events: none; }
    /* Mirror webcam horizontally — feels like a mirror to the user. The
       captured world landmarks aren't mirrored (we capture the raw
       MediaPipe output); only the preview is flipped. */
    #webcam { transform: scaleX(-1); }
    #overlay { transform: scaleX(-1); }
    #countdown {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 120px; font-weight: bold; color: #e94560; text-shadow: 0 0 20px #000;
      pointer-events: none; opacity: 0; transition: opacity 0.15s; font-family: monospace;
    }
    #countdown.show { opacity: 1; }
    #panel { width: 280px; background: #16213e; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    #panel h2 { color: #e94560; font-size: 18px; margin-bottom: 4px; }
    #panel h3 { color: #aaa; font-size: 13px; text-transform: uppercase; margin-top: 8px; }
    .btn { padding: 10px; background: #2a2a4e; border: 2px solid #444; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center; user-select: none; }
    .btn:hover:not(.disabled) { background: #3a3a5e; }
    .btn.active { border-color: #e94560; background: #e94560; }
    .btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.danger { border-color: #e94560; color: #e94560; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; }
    label { font-size: 13px; color: #ccc; }
    select, input[type=text], input[type=number] {
      width: 100%; padding: 6px; background: #2a2a4e; color: white;
      border: 1px solid #444; border-radius: 4px; font-family: monospace; font-size: 13px;
    }
    #status {
      background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 4px;
      padding: 8px; font-family: monospace; font-size: 12px; color: #ffd700;
      white-space: pre-line; min-height: 60px;
    }
    #error { color: #e94560; font-family: monospace; font-size: 12px; white-space: pre-line; }
    #clip-list { display: flex; flex-direction: column; gap: 4px; }
    .clip-row {
      background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 4px;
      padding: 6px; display: flex; flex-direction: column; gap: 4px;
    }
    .clip-row .clip-meta { font-family: monospace; font-size: 11px; color: #aaa; }
    .clip-row .clip-name { font-family: monospace; font-size: 12px; color: #fff; word-break: break-all; }
    .clip-row .clip-actions { display: flex; gap: 4px; }
    .clip-row .clip-actions .btn { flex: 1; padding: 4px; font-size: 11px; }
    .nav-row { display: flex; gap: 6px; }
    .nav-row .btn {
      flex: 1; background: #1f2540; border-color: #e94560; color: #e94560;
      text-decoration: none; font-size: 13px; padding: 6px 8px;
    }
    /* Fit results pane — matches the dark-panel aesthetic with #e94560 accents. */
    #fit-results {
      background: #1a1a2e; border: 1px solid #e94560; border-radius: 4px;
      padding: 8px; display: flex; flex-direction: column; gap: 8px;
    }
    #fit-results .fit-header {
      color: #e94560; font-size: 13px; font-weight: bold;
      font-family: monospace; word-break: break-all;
    }
    #fit-results .fit-hint {
      font-size: 11px; color: #aaa; line-height: 1.4;
    }
    #fit-results .fit-hint strong { color: #ddd; }
    #fit-results .fit-section-title {
      font-size: 11px; color: #aaa; text-transform: uppercase;
      letter-spacing: 1px;
    }
    #fit-results .fit-diag {
      font-family: monospace; font-size: 11px; color: #ddd;
      display: grid; grid-template-columns: auto 1fr; gap: 2px 8px;
    }
    #fit-results .fit-diag .label { color: #888; }
    #fit-results .fit-diag .conf-good { color: #6dd47e; }
    #fit-results .fit-diag .conf-mid  { color: #ffd700; }
    #fit-results .fit-diag .conf-bad  { color: #e94560; }
    #fit-results .fit-warnings { list-style: none; padding-left: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    #fit-results .fit-warnings li {
      font-size: 11px; color: #ffd700; font-family: monospace;
      background: #2a2410; border-left: 3px solid #ffd700;
      padding: 4px 6px; word-break: break-word;
    }
    #fit-results pre.fit-json {
      background: #0d101e; color: #d4d4dc; border: 1px solid #2a2a4e;
      border-radius: 3px; padding: 8px; font-family: monospace;
      font-size: 11px; max-height: 240px; overflow: auto; white-space: pre;
      margin: 0;
    }
    #fit-results .fit-error {
      background: #2a1018; border-left: 3px solid #e94560;
      color: #ff8da3; font-family: monospace; font-size: 11px;
      padding: 6px 8px; white-space: pre-wrap; word-break: break-word;
    }
    #fit-results .fit-empty-note {
      font-size: 11px; color: #aaa; font-style: italic;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-wrap">
      <div id="stage">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="countdown"></div>
      </div>
    </div>
    <div id="panel">
      <h2>Mocap Editor</h2>
      <div class="nav-row">
        <a href="index.html" class="btn">&larr; Back to Game</a>
        <a href="anim-viewer.html" class="btn">Animation Viewer &rarr;</a>
        <a href="face-editor.html" class="btn">Face Editor &rarr;</a>
        <a href="face-mirror.html" class="btn">Face Mirror &rarr;</a>
      </div>

      <h3>Target Animation</h3>
      <select id="target-anim">
        <option value="idle">idle</option>
        <option value="walk" selected>walk</option>
        <option value="walk-backward">walk-backward</option>
        <option value="sprint">sprint</option>
        <option value="dribble">dribble</option>
        <option value="dribble-walk">dribble-walk</option>
        <option value="dribble-sprint">dribble-sprint</option>
        <option value="guard">guard</option>
        <option value="custom">custom</option>
      </select>

      <h3>Orientation</h3>
      <select id="orientation">
        <option value="side" selected>side</option>
        <option value="front">front</option>
        <option value="three-quarter">three-quarter</option>
      </select>

      <h3>Clip Name</h3>
      <input id="clip-name" type="text" placeholder="e.g. walk-side-1" />

      <h3>Duration (s)</h3>
      <input id="duration" type="number" min="1" max="30" step="1" value="6" />

      <h3>FPS</h3>
      <select id="fps">
        <option value="24">24</option>
        <option value="30" selected>30</option>
        <option value="60">60</option>
      </select>

      <h3>Status</h3>
      <div id="status">idle</div>
      <div id="error"></div>

      <div class="btn-row">
        <div class="btn" id="btn-camera">Start camera</div>
      </div>
      <div class="btn-row">
        <div class="btn disabled" id="btn-record">Record</div>
        <div class="btn disabled danger" id="btn-stop">Stop</div>
      </div>

      <h3>Clips</h3>
      <div id="clip-list"></div>
      <div class="btn-row">
        <div class="btn" id="btn-import">Import JSON</div>
      </div>
      <input id="import-file" type="file" accept="application/json" style="display:none" />

      <div id="fit-results" style="display:none;"></div>
    </div>
  </div>
  <script type="module" src="/src/mocap-editor.ts"></script>
</body>
</html>
