<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#f8ae52"/>
      <stop offset="45%" stop-color="#dc7620"/>
      <stop offset="82%" stop-color="#a04c0a"/>
      <stop offset="100%" stop-color="#6c3205"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="12" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Ball body -->
    <circle cx="256" cy="256" r="232" fill="url(#ball)"/>
    <!-- Outer rim -->
    <circle cx="256" cy="256" r="232" fill="none" stroke="#2a1605" stroke-width="9"/>
    <!-- Seams: equator across + vertical seam + two side curves -->
    <g stroke="#2a1605" stroke-width="10" stroke-linecap="round" fill="none">
      <!-- Horizontal equator -->
      <path d="M 30 256 Q 256 290 482 256"/>
      <!-- Vertical seam across the front face (curved to suggest sphere) -->
      <path d="M 256 24 Q 220 256 256 488"/>
      <!-- Left side curve (sweeps from top toward bottom-left edge) -->
      <path d="M 256 24 Q 60 156 30 262"/>
      <path d="M 256 488 Q 60 356 30 250"/>
      <!-- Right side curve -->
      <path d="M 256 24 Q 452 156 482 262"/>
      <path d="M 256 488 Q 452 356 482 250"/>
    </g>
    <!-- Specular highlight -->
    <ellipse cx="170" cy="150" rx="72" ry="36" fill="#ffffff" opacity="0.22" transform="rotate(-22 170 150)"/>
    <ellipse cx="135" cy="175" rx="26" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-22 135 175)"/>
  </g>
</svg>
